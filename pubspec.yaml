name: bitacora
description: "Bitácora: diario personal con fotos, dictado por voz y GPS. Parcial 2."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2          # base de datos local
  path: ^1.9.0             # para armar rutas de archivos
  path_provider: ^2.1.5    # carpeta donde guardamos las fotos
  image_picker: ^1.2.0     # cámara y galería
  speech_to_text: ^7.3.0   # micrófono: voz a texto
  geolocator: ^14.0.2      # GPS
  url_launcher: ^6.3.2     # abrir Google Maps
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
