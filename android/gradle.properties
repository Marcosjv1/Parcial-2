# Memoria que puede usar Gradle al compilar (3 GB). Lo bajamos para que la laptop no se trabe
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Usar las librerías nuevas de Android (AndroidX), lo pide Flutter
android.useAndroidX=true
# Estas dos las puso la plantilla de Flutter, no hay que moverles
android.newDsl=false
android.builtInKotlin=false
# Optimizaciones para compilar más rápido:
# caching = reutiliza lo que ya compiló antes
org.gradle.caching=true
# parallel = compila varias partes al mismo tiempo
org.gradle.parallel=true
# Memoria para el compilador de Kotlin
kotlin.daemon.jvmargs=-Xmx1G
